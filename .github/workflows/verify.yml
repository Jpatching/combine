name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandcastle-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - name: Check Sandcastle runner without Docker or credentials
        working-directory: tools/sandcastle
        run: |
          npm ci --ignore-scripts
          npm run check
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Verify source metadata, documentation and Python tests
        run: python3 scripts/verify.py
      - name: Check GTA adapter and read-only status script
        run: |
          node tools/gtaiv-skate/tests/script.cjs
          node tools/gtaiv-skate/tests/status-script.cjs
          rustc --edition=2024 --test tools/gtaiv-skate/tests/wire.rs -o /tmp/combine-worker-wire-tests
          /tmp/combine-worker-wire-tests
  game-status-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check status report with synthetic state
        shell: powershell
        run: ./tools/gtaiv-skate/tests/status.ps1
