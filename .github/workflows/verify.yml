name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandcastle-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.10.0'
      - name: Check Sandcastle runner without Docker or credentials
        working-directory: tools/sandcastle
        run: |
          npm ci --ignore-scripts
          npm run check
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Verify source metadata, documentation and Python tests
        run: python3 scripts/verify.py
      - name: Check pinned GTA native definition contracts
        run: |
          curl --fail --location --max-time 30 --retry 2 https://raw.githubusercontent.com/sannybuilder/library/34bedee0be2f57047ed8f0705c81f137ede3d3ce/gta_iv/gta_iv.json -o /tmp/combine-pinned-gta_iv.json
          python3 tools/gtaiv-skate/tests/definitions.py /tmp/combine-pinned-gta_iv.json
      - name: Check authored GTA adapter behavior
        run: python3 tools/gtaiv-skate/check.py
  game-status-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check status report with synthetic state
        shell: powershell
        run: ./tools/gtaiv-skate/tests/status.ps1
